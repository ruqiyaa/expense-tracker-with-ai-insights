<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card wide">
    <div class="top-bar">
      <h1>My Expenses</h1>
      <div>
        <span id="welcome"></span>
        <button id="logout-btn" class="small secondary">Log out</button>
      </div>
    </div>

    <label>Month <input type="month" id="month"></label>

    <section>
      <h2>Summary</h2>
      <p id="total" class="total"></p>
      <ul id="summary-list"></ul>
    </section>

    <section>
      <h2>Add a category</h2>
      <form id="category-form" class="row">
        <input id="category-name" placeholder="e.g. Food" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section>
      <h2>Add an expense</h2>
      <form id="expense-form">
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <input id="description" placeholder="What was it for?">
        <input id="date" type="date" required>
        <select id="category"></select>
        <button type="submit">Add expense</button>
      </form>
    </section>

    <p id="message" class="message"></p>

    <section>
      <h2>Expenses</h2>
      <ul id="expense-list"></ul>
    </section>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
