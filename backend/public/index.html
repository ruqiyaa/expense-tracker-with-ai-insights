<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="card">
        <h1>Expense Tracker</h1>
        <h2 id="form-title">Log In</h2>

        <form id="auth-form">
            <input type="text" id="name" placeholder="Your name" hidden>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="password" placeholder="Password (min 6 characters)" required>
            <button id="submit-btn" type="submit">Log in</button>
        </form>

        <p id="message" class="message"></p>

        <p>
            <span id="switch-text">New here?</span>
            <a href="#" id="switch-link">Create an account</a>
        </p>
    </main>

    <script src="/js/auth.js"></script>
    
</body>
</html>
